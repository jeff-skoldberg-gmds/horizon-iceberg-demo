# Attaches the Horizon Iceberg REST catalog twice: ICE_RAW to read dlt-landed
# data, ICE_TRANSFORMED to persist the staging model. `secret` names a DuckDB
# secret defined in profiles.yml (credentials never live here).
catalogs:
  # Source: raw Iceberg landed by the dlt LOADER.
  - name: ice_raw
    type: iceberg_rest
    table_format: iceberg
    config:
      duckdb:
        endpoint: "{{ env_var('HORIZON_CATALOG_URI') }}"
        warehouse: ICE_RAW
        secret: horizon
        attach_as: ice_raw
        access_delegation_mode: VENDED_CREDENTIALS

  # Target: where the TRANSFORMER persists models. See NOTES_horizon_write_path.md
  # for what the write-compat options below each fix.
  - name: ice_transformed
    type: iceberg_rest
    table_format: iceberg
    config:
      duckdb:
        endpoint: "{{ env_var('HORIZON_CATALOG_URI') }}"
        warehouse: ICE_TRANSFORMED
        secret: horizon
        attach_as: ice_transformed
        access_delegation_mode: VENDED_CREDENTIALS
        stage_create_tables: false
        disable_multi_table_commit: true
        skip_create_table_metadata_updates: true
        remove_files_on_delete: false
