[project]
name = "horizon-iceberg-demo"
version = "0.1.0"
description = "Root Python workspace for the Horizon Iceberg demo: dbt-duckdb TRANSFORMER (read ICE_RAW, transform in DuckDB, write ICE_TRANSFORMED as native Snowflake-managed Iceberg via the Horizon REST catalog). The dlt loader lives in dlt/ as its own dltHub workspace."
requires-python = ">=3.10"
dependencies = [
    "dbt-duckdb>=1.9.0",
    # DuckDB >= 1.5.4 ships the duckdb-iceberg#1017 Horizon write-compat ATTACH options
    # (stage_create_tables / disable_multi_table_commit / skip_create_table_metadata_updates
    # / remove_files_on_delete) that the native write depends on.
    "duckdb>=1.5.4",
    # Only used by the cross-engine verification read-back in README.md (independent client).
    "pyiceberg>=0.11.0",
    "pyarrow>=15.0.0",
]
